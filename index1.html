<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="fbheader">
        <h1 class="fblogo">facebook</h1>
        <div class="logform">
            <label for="" id="emaillab">Email or Phone</label>
            <input type="text">
            <label for="" id="pswdlab">Password</label>
            <input type="text">
            <button id="logbtn">Login</button>
        </div>

        <div class="signup">
            <div class="signup-title">Sign Up</div>
            <div class="signup-subtitle">Its free and always will be.</div>
            <input type="text" class="input firstname" placeholder="First Name">
            <input type="text" class="input lastname" placeholder="Last Name">
            <input type="email" class="input email" placeholder="Your Email">
            <input type="email" class="input reemail" placeholder="Re-enter Email"> 
            <input type="password" class="input password" placeholder="New Password">
            
            <div class="birthday-title">Birthday:</div>
            <select class="select month">
                <option value="">Month</option>
                <option value="">January</option>
                <option value="">February</option>
                <option value="">March</option>
                <option value="">April</option>
                <option value="">May</option>
                <option value="">June</option>
                <option value="">July</option>
                <option value="">August</option>
                <option value="">September</option>
                <option value="">October</option>
                <option value="">November</option>
                <option value="">December</option>

            </select>
            <select class="select day">
                <option value="">Day</option>
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>
                <option value="">6</option>
                <option value="">7</option>
                <option value="">8</option>
                <option value="">9</option>
                <option value="">10</option>
                <option value="">11</option>
            </select>

            <select class="select year">
                <option value="">Year</option>
                <option value="">2000</option>
                <option value="">2001</option>
                <option value="">2002</option>
                <option value="">2003</option>
                <option value="">2004</option>
                <option value="">2005</option>

            </select>

            <div class="birthday-help">Why do I need to provide my birthday?</div>

            <div class="gender">
                <label for=""><input type="radio" name="gender" id="">Female</label>
                <label for=""><input type="radio" name="gender" id="">Male</label>
            </div>

            <div class="terms">
                By clicking Sign Up, you agree to our Terms and that you have read our Data Use Policy, including our Cookie Use
            </div>

            <button class="signup-button">Sign Up</button>
            <div class="create-page">
                <b>Create a Page</b> for a celebrity, band or business
            </div>
        </div>
    </header>
</body>
</html>
